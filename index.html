<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Froggy Jump - Media Pembelajaran Interaktif</title>
  <style>
    :root {
      --bg-water: #1a5f7a;
      --bg-water-dark: #083344;
      --leaf-green: #22c55e;
      --leaf-dark: #15803d;
      --accent-yellow: #facc15;
      --danger-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-water-dark);
      color: var(--text-light);
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
      z-index: 100;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .game-info {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .game-title {
      color: var(--accent-yellow);
    }

    .top-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn, .select-input {
      background: #334155;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.2s;
      outline: none;
    }

    .btn:hover, .select-input:hover { background: #475569; }
    .btn-active { background: var(--leaf-green); border-color: var(--leaf-green); }

    /* Main Container & Grid Mode */
    #app-container {
      position: absolute;
      top: 50px;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      gap: 4px;
      background: #0f172a;
    }

    /* Grid Layouts for Modes */
    .mode-solo { grid-template-columns: 1fr; }
    .mode-duel { grid-template-columns: 1fr 1fr; }
    .mode-squad { grid-template-columns: 1fr 1fr 1fr 1fr; }

    @media (max-width: 768px) and (orientation: portrait) {
      .mode-squad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    }

    /* Viewport Player Canvas */
    .player-viewport {
      position: relative;
      background: linear-gradient(to bottom, #0284c7, var(--bg-water));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Rain Effect Overlay */
    .rain-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
      width: 1px;
      height: 25px;
      opacity: 0.6;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(100vh); }
    }

    /* Player Header */
    .player-header {
      position: relative;
      z-index: 10;
      padding: 0.5rem;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-tag {
      background: var(--accent-yellow);
      color: #000;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .score-board {
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* Stage / Game Area */
    .game-stage {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 20px;
    }

    /* Question Panel */
    .question-card {
      position: absolute;
      top: 15px;
      left: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      padding: 0.8rem;
      border-radius: 12px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      z-index: 10;
      transition: transform 0.3s ease;
    }

    /* Platforms (Lily Pads) Area */
    .platforms-container {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 10px;
      z-index: 5;
      margin-bottom: 40px;
      transition: transform 0.5s ease;
    }

    .platforms-container.slide-down {
      transform: translateY(120px);
      opacity: 0;
    }

    .platform {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
      flex: 1;
      max-width: 90px;
      margin: 0 4px;
    }

    .platform:hover { transform: scale(1.08); }

    .lily-pad {
      width: 100%;
      height: 45px;
      background: var(--leaf-green);
      border-bottom: 4px solid var(--leaf-dark);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }

    .pad-label {
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
      text-align: center;
      padding: 0 4px;
    }

    /* Frog Element */
    .frog {
      width: 45px;
      height: 45px;
      position: absolute;
      bottom: 95px;
      z-index: 8;
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), bottom 0.3s ease, transform 0.3s ease;
    }

    .frog-body {
      width: 100%;
      height: 100%;
      background: #4ade80;
      border-radius: 50% 50% 40% 40%;
      position: relative;
      border: 2px solid #15803d;
    }

    .frog-eye {
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      border: 1px solid #15803d;
    }
    .frog-eye.left { left: 4px; }
    .frog-eye.right { right: 4px; }
    .frog-eye::after {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background: black;
      border-radius: 50%;
      margin: 3px auto;
    }

    /* Animations */
    .frog-happy {
      animation: happyJump 0.4s infinite alternate ease-in-out;
    }

    @keyframes happyJump {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-25px) scale(1.1); }
    }

    .frog-sink {
      animation: sinkInWater 0.8s forwards ease-in;
    }

    @keyframes sinkInWater {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      50% { transform: translateY(30px) scale(0.8); opacity: 0.8; }
      100% { transform: translateY(80px) scale(0.2); opacity: 0; }
    }

    /* Water Waves & Splash */
    .water-surface {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(255, 255, 255, 0.15);
      border-top: 2px solid rgba(255,255,255,0.3);
      animation: wave 2s infinite ease-in-out alternate;
    }

    @keyframes wave {
      from { transform: translateY(0); }
      to { transform: translateY(6px); }
    }

    .splash {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.8);
      pointer-events: none;
      animation: splashAnim 0.6s ease-out forwards;
      z-index: 7;
    }

    @keyframes splashAnim {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 60px; height: 30px; opacity: 0; transform: translateY(-10px); }
    }

    /* Game Over / Win Overlay */
    .viewport-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 1rem;
      text-align: center;
    }

    .viewport-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls -->
  <div class="top-bar">
    <div class="game-info">
      <span class="game-title">FROGGY JUMP</span>
      <span id="game-meta" style="opacity:0.7;">| Grade 6</span>
    </div>
    <div class="top-controls">
      <!-- Pilihan Jumlah Soal -->
      <select id="question-count-select" class="select-input" onchange="changeQuestionLimit(this.value)">
        <option value="5">5 Soal</option>
        <option value="10">10 Soal</option>
        <option value="15">15 Soal</option>
        <option value="all">Semua Soal</option>
      </select>

      <button class="btn btn-active" onclick="setMode('solo')">Solo (1P)</button>
      <button class="btn" onclick="setMode('duel')">Duel (2P)</button>
      <button class="btn" onclick="setMode('squad')">Squad (4P)</button>
      <button class="btn" onclick="toggleAudio()" id="audio-btn">🔊 BGM</button>
      <button class="btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>
  </div>

  <!-- App Container (Dynamic Viewports) -->
  <div id="app-container" class="mode-solo"></div>

  <script>
    /* ===================================================================
       1. KONFIGURASI TARGET & MATERI
       =================================================================== */
    const GAME_CONFIG = {
      title: "Ciri-Ciri Makhluk Hidup & IPA",
      grade: "Kelas 6 SD",
      optionsCount: 4,
      questions: [
        { q: "Tumbuhan yang menggulungkan daunya saat kering untuk mengurangi penguapan adalah?", a: ["Jagung", "Mawar", "Cactus", "Kelapa"], correct: 0 },
        { q: "Bentuk adaptasi pohon jati saat musim kemarau adalah?", a: ["Menggugurkan daun", "Mematikan batang", "Memanjangkan akar", "Berbunga"], correct: 0 },
        { q: "Alat pernapasan khusus pada ikan yang hidup di lumpur adalah?", a: ["Labirin", "Paru-paru", "Trakea", "Insang luar"], correct: 0 },
        { q: "Kaktus mengubah daunya menjadi duri bertujuan untuk...", a: ["Mengurangi penguapan", "Menyimpan air", "Menarik serangga", "Fotosintesis"], correct: 0 },
        { q: "Kelelawar dapat mengetahui posisi benda dengan suara tinggi melalui kemampuan...", a: ["Ekolokasi", "Autotomi", "Mimikri", "Kamuflase"], correct: 0 },
        { q: "Cicak memutuskan ekornya untuk mengelabuhi musuh disebut...", a: ["Autotomi", "Mimikri", "Adaptasi", "Ekolokasi"], correct: 0 },
        { q: "Tumbuhan eceng gondok memiliki batangnya yang berongga bertujuan untuk...", a: ["Mengapung di air", "Menyimpan makanan", "Menyerap air", "Fotosintesis"], correct: 0 },
        { q: "Bentuk paruh burung kolibri yang panjang dan runcing berguna untuk...", a: ["Mengiut nektar", "Memecah biji", "Mencengkeram mangsa", "Menyaring lumpur"], correct: 0 },
        { q: "Unta memiliki punuk pada punggungnya yang berfungsi untuk...", a: ["Menyimpan lemak", "Menyimpan air", "Menjaga suhu tubuh", "Menghalau pasir"], correct: 0 },
        { q: "Tumbuhan venus memakan serangga untuk memenuhi kebutuhan unsur...", a: ["Nitrogen", "Oksigen", "Karbon", "Kalsium"], correct: 0 }
      ]
    };

    let selectedQuestionLimit = 5;

    /* ===================================================================
       2. AUDIO SYNTHESIZER (Web Audio API)
       =================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmInterval = null;
        this.isMuted = false;
      }

      playTone(freq, type, duration) {
        if (this.isMuted) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }

      playCorrect() {
        this.playTone(523.25, 'triangle', 0.15);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.15), 100);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.3), 200);
      }

      playWrong() {
        this.playTone(220, 'sawtooth', 0.2);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.4), 150);
      }

      playSplash() {
        if (this.isMuted) return;
        try {
          const bufferSize = this.ctx.sampleRate * 0.3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1000;
          noise.connect(filter);
          filter.connect(this.ctx.destination);
          noise.start();
        } catch(e){}
      }

      toggleBGM() {
        this.isMuted = !this.isMuted;
        if (!this.isMuted) {
          let note = 0;
          const notes = [261.63, 329.63, 392.00, 329.63];
          this.bgmInterval = setInterval(() => {
            this.playTone(notes[note % notes.length], 'sine', 0.2);
            note++;
          }, 400);
        } else {
          clearInterval(this.bgmInterval);
        }
        return !this.isMuted;
      }
    }

    const audio = new SoundEngine();

    /* ===================================================================
       3. GAME ENGINE & PLAYER LOGIC
       =================================================================== */
    let activeMode = 'solo';
    let players = [];

    class PlayerSession {
      constructor(id, container) {
        this.id = id;
        this.container = container;
        this.score = 0;
        this.currentQIndex = 0;
        this.isLocked = false;
        this.activeQuestions = [];
        this.initUI();
        this.prepareQuestionSet();
        this.loadQuestion();
      }

      initUI() {
        this.container.innerHTML = `
          <div class="rain-layer" id="rain-${this.id}"></div>
          <div class="player-header">
            <span class="player-tag">PEMAIN ${this.id}</span>
            <span class="score-board" id="score-${this.id}">Skor: 0</span>
          </div>
          <div class="game-stage">
            <div class="question-card" id="q-card-${this.id}">Loading...</div>
            <div class="frog" id="frog-${this.id}">
              <div class="frog-body">
                <div class="frog-eye left"></div>
                <div class="frog-eye right"></div>
              </div>
            </div>
            <div class="platforms-container" id="pads-${this.id}"></div>
            <div class="water-surface"></div>
          </div>
          <div class="viewport-overlay" id="overlay-${this.id}">
            <h2 id="overlay-title-${this.id}">Selesai!</h2>
            <p id="overlay-desc-${this.id}" style="margin: 10px 0;"></p>
            <button class="btn btn-active" onclick="resetPlayer(${this.id})">Main Lagi</button>
          </div>
        `;

        this.generateRain();
        this.frogEl = this.container.querySelector(`#frog-${this.id}`);
        this.padsContainer = this.container.querySelector(`#pads-${this.id}`);
        this.qCard = this.container.querySelector(`#q-card-${this.id}`);
        this.scoreEl = this.container.querySelector(`#score-${this.id}`);
        this.overlay = this.container.querySelector(`#overlay-${this.id}`);
      }

      prepareQuestionSet() {
        let pool = [...GAME_CONFIG.questions].sort(() => Math.random() - 0.5);
        if (selectedQuestionLimit !== 'all') {
          const limit = parseInt(selectedQuestionLimit);
          this.activeQuestions = pool.slice(0, limit);
        } else {
          this.activeQuestions = pool;
        }
      }

      generateRain() {
        const rainLayer = this.container.querySelector(`#rain-${this.id}`);
        for (let i = 0; i < 15; i++) {
          const drop = document.createElement('div');
          drop.className = 'drop';
          drop.style.left = `${Math.random() * 100}%`;
          drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
          drop.style.animationDelay = `${Math.random() * 2}s`;
          rainLayer.appendChild(drop);
        }
      }

      loadQuestion() {
        if (this.currentQIndex >= this.activeQuestions.length) {
          this.showEndOverlay(true);
          return;
        }

        const qData = this.activeQuestions[this.currentQIndex];
        this.qCard.textContent = `[${this.currentQIndex + 1}/${this.activeQuestions.length}] ${qData.q}`;
        this.padsContainer.innerHTML = '';
        this.padsContainer.classList.remove('slide-down');
        this.frogEl.className = 'frog';
        
        this.frogEl.style.left = 'calc(50% - 22.5px)';
        this.frogEl.style.bottom = '95px';

        qData.a.forEach((optText, idx) => {
          const plat = document.createElement('div');
          plat.className = 'platform';
          plat.onclick = () => this.handleAnswer(idx, plat);
          plat.innerHTML = `
            <div class="lily-pad">
              <span class="pad-label">${optText}</span>
            </div>
          `;
          this.padsContainer.appendChild(plat);
        });

        this.isLocked = false;
      }

      handleAnswer(selectedIndex, platformEl) {
        if (this.isLocked) return;
        this.isLocked = true;

        const qData = this.activeQuestions[this.currentQIndex];
        const isCorrect = selectedIndex === qData.correct;

        const rect = platformEl.getBoundingClientRect();
        const stageRect = this.container.querySelector('.game-stage').getBoundingClientRect();
        const targetLeft = (rect.left + rect.width / 2) - stageRect.left - 22.5;

        this.frogEl.style.left = `${targetLeft}px`;
        this.frogEl.style.bottom = '110px';

        setTimeout(() => {
          if (isCorrect) {
            audio.playCorrect();
            this.frogEl.classList.add('frog-happy');
            this.score += 10;
            this.scoreEl.textContent = `Skor: ${this.score}`;

            setTimeout(() => {
              this.padsContainer.classList.add('slide-down');
              setTimeout(() => {
                this.currentQIndex++;
                this.loadQuestion();
              }, 500);
            }, 800);

          } else {
            audio.playWrong();
            setTimeout(() => {
              this.frogEl.classList.add('frog-sink');
              audio.playSplash();
              this.createSplash(targetLeft + 22.5);

              setTimeout(() => {
                this.showEndOverlay(false);
              }, 1000);
            }, 300);
          }
        }, 300);
      }

      createSplash(xPos) {
        const splash = document.createElement('div');
        splash.className = 'splash';
        splash.style.left = `${xPos - 5}px`;
        splash.style.bottom = '40px';
        this.container.querySelector('.game-stage').appendChild(splash);
        setTimeout(() => splash.remove(), 600);
      }

      showEndOverlay(isWin) {
        const title = this.container.querySelector(`#overlay-title-${this.id}`);
        const desc = this.container.querySelector(`#overlay-desc-${this.id}`);
        
        if (isWin) {
          title.textContent = "🏆 Luar Biasa!";
          desc.textContent = `Pemain ${this.id} menyelesaikan ${this.activeQuestions.length} soal! Skor Akhir: ${this.score}`;
        } else {
          title.textContent = "🌊 Oops, Tenggelam!";
          desc.textContent = `Jawaban kurang tepat di soal ke-${this.currentQIndex + 1}. Skor Akhir: ${this.score}`;
        }
        this.overlay.classList.add('active');
      }

      reset() {
        this.score = 0;
        this.currentQIndex = 0;
        this.scoreEl.textContent = `Skor: 0`;
        this.overlay.classList.remove('active');
        this.prepareQuestionSet();
        this.loadQuestion();
      }
    }

    /* ===================================================================
       4. CONTROLLER & RESPONSIVE LAYOUT MANAGEMENT
       =================================================================== */
    const appContainer = document.getElementById('app-container');

    function changeQuestionLimit(val) {
      selectedQuestionLimit = val;
      players.forEach(p => p.reset());
    }

    function setMode(mode) {
      activeMode = mode;
      appContainer.className = `mode-${mode}`;
      
      document.querySelectorAll('.top-controls .btn').forEach(btn => {
        if (btn.textContent.toLowerCase().includes(mode)) {
          btn.classList.add('btn-active');
        } else if (!btn.id.includes('audio') && !btn.textContent.includes('Fullscreen')) {
          btn.classList.remove('btn-active');
        }
      });

      const countMap = { 'solo': 1, 'duel': 2, 'squad': 4 };
      const playerCount = countMap[mode];
      
      appContainer.innerHTML = '';
      players = [];

      for (let i = 1; i <= playerCount; i++) {
        const vp = document.createElement('div');
        vp.className = 'player-viewport';
        appContainer.appendChild(vp);
        players.push(new PlayerSession(i, vp));
      }
    }

    function resetPlayer(id) {
      const p = players.find(player => player.id === id);
      if (p) p.reset();
    }

    function toggleAudio() {
      const isMuted = !audio.toggleBGM();
      document.getElementById('audio-btn').textContent = isMuted ? '🔇 Mute' : '🔊 BGM';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.getElementById('game-meta').textContent = `| ${GAME_CONFIG.title} (${GAME_CONFIG.grade})`;

    setMode('solo');
  </script>
</body>
</html>
